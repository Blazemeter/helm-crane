apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-hookrole
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings", "roles"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets", "namespaces", "pods", "nodes", "services", "endpoints", "configmaps"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name:  test-hookrole-binding-{{ template "blazemeter-crane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
- kind: ServiceAccount
  name: {{ template "blazemeter-crane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name:  test-hookrole
  apiGroup: rbac.authorization.k8s.io

{{ if .Values.istio_ingress.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-hookrole-istio
  namespace: istio-system
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name:  test-hookrole-istio-binding-{{ template "blazemeter-crane.serviceAccountName" . }}
  namespace: istio-system
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
- kind: ServiceAccount
  name: {{ template "blazemeter-crane.serviceAccountName" . }}           # or your custom SA name
  namespace: {{ .Release.Namespace }}      # your pod's namespace
roleRef:
  kind: Role
  name: test-hookrole-istio
  apiGroup: rbac.authorization.k8s.io
{{ end }}