apiVersion: v1
kind: Pod
metadata:
  name: cranetesthook
  namespace: {{ .Release.Namespace }}
  {{ if .Values.labelsCranePod.enable -}}
  labels: 
      {{ .Values.labelsCranePod.syntax | toYaml | nindent 4 }}
  {{ end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-container-name": cranetestctr
    "sidecar.istio.io/inject": "false" 
spec:
  serviceAccountName: {{ template "blazemeter-crane.serviceAccountName" . }}
  automountServiceAccountToken: true
  #ttlSecondsAfterFinished: 90
  {{ if .Values.nodeSelectorCrane.enable }}
  nodeSelector:
    {{ .Values.nodeSelectorCrane.syntax | toYaml | nindent 4 }}      
  {{ end -}}
  {{ if .Values.nodeSelectorCrane.enable }}
  tolerations:
    {{ .Values.nodeSelectorCrane.syntax | toYaml | nindent 4 }}
  {{ end }}  
  containers:
  - name: cranetestctr
    securityContext:
      runAsUser: 1337
      runAsGroup: 1337
      allowPrivilegeEscalation: false
      runAsNonRoot: true
    env: 
    - name: WORKING_NAMESPACE
      value: {{ .Release.Namespace | quote }}
    - name: ROLE_NAME
      value: {{ .Release.Name }}-{{ .Values.deployment.role }}
    - name: ROLE_BINDING_NAME
      value: {{ .Release.Name }}-{{ .Values.deployment.role }}-binding-{{ template "blazemeter-crane.serviceAccountName" . }}
    - name: SERVICE_ACCOUNT_NAME
      value: {{ template "blazemeter-crane.serviceAccountName" . }}
    {{ if and (.Values.istio_ingress.enable)  (eq .Values.nginx_ingress.enable false) }}
    - name: SV_ENABLE
      value: "true"
    - name: KUBERNETES_WEB_EXPOSE_TYPE
      value: "ISTIO"
    - name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
      value: {{ .Values.istio_ingress.credentialName | quote }}
    - name: KUBERNETES_ISTIO_GATEWAY_NAME
      value: {{ .Values.istio_ingress.istio_gateway_name | quote }}        
    {{ end -}}
    {{ if and (.Values.nginx_ingress.enable)  (eq .Values.istio_ingress.enable false)}}
    - name: SV_ENABLE
      value: "true"
    - name: KUBERNETES_WEB_EXPOSE_TYPE
      value: "INGRESS"
    - name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
      value: {{ .Values.nginx_ingress.credentialName | quote }}
    {{ end -}}
    {{ if .Values.imageOverride.enable }}
    - name: DOCKER_REGISTRY
      value: {{ .Values.imageOverride.docker_registry | quote }}
    - name: AUTO_KUBERNETES_UPDATE
    {{ else -}}    
    - name: DOCKER_REGISTRY
      value: {{ .Values.image.docker_registry | quote }}
    {{ end }}       
    {{ if .Values.proxy.enable -}}
      {{ if .Values.proxy.http_proxy }}
    - name: HTTP_PROXY
      value: {{ .Values.proxy.http_path }}
      {{ end -}}
      {{ if .Values.proxy.https_proxy }}
    - name: HTTPS_PROXY
      value: {{ .Values.proxy.https_path }}
      {{ end }}
    - name: NO_PROXY
      value: {{ .Values.proxy.no_proxy }}
    {{ end }}
    {{ if .Values.imageOverride.enable }}
    image: {{ .Values.imageOverride.testImage }}:{{ .Values.imageOverride.testTag }}
    imagePullPolicy: "never"
    {{ else }}
    image: {{ .Values.image.testImage }}:{{ .Values.image.testTag }}
    imagePullPolicy: "never"
    {{ end -}}
  {{ with .Values.resourcesCrane -}}
    {{ if or (.requests.CPU) (.limits.CPU) (.limits.MEM) (.requests.MEM) (.requests.storage) (.limits.storage) }}
    resources:
      {{ if or (.requests.MEM) (.requests.CPU) (.requests.storage) }}  
      requests:
        cpu: {{ .requests.CPU | default "100m" }}
        memory: {{ .requests.MEM | default "256Mi" }}
        {{ if .requests.storage }}
        storage: {{ .requests.storage }}
        {{ end -}}
      {{ end -}}
      {{ if or (.limits.MEM) (.limits.CPU) (.limits.storage) }} 
      limits:
        cpu: {{ .limits.CPU | default "200" }}  
        memory: {{ .limits.MEM | default "512Mi" }}
        {{ if .limits.storage }}
        storage: {{ .limits.storage }}
        {{ end -}}       
      {{ end -}}
    {{ end -}}
  {{ end }}
  restartPolicy: "Never"
