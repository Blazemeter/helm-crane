apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    role: {{ .Release.Name }}-{{ .Values.deployment.role }}
    {{ if .Values.labelsCraneDeployment.enable -}}
    {{ .Values.labelsCraneDeployment.syntax | toYaml | nindent 4 }}
    {{ end -}}
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      role: {{ .Release.Name }}-{{ .Values.deployment.role }}
      crane: ready
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
      {{ if .Values.labelsCranePod.enable -}}
      {{ .Values.labelsCranePod.syntax | toYaml | nindent 8 }}
      {{ end }}
        role: {{ .Release.Name }}-{{ .Values.deployment.role }}
        crane: ready
    spec:
      serviceAccountName: {{ template "blazemeter-crane.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{ if .Values.nodeSelectorCrane.enable }}
      nodeSelector:
        {{ .Values.nodeSelectorCrane.syntax | toYaml | nindent 8 }}      
      {{ end -}}
      {{ if .Values.tolerationCrane.enable }}
      tolerations:
      {{ .Values.tolerationCrane.syntax | toYaml | nindent 8 }}
      {{ end -}}
      containers:
      - env:
        {{- if and ( .Values.secretProviderClass.enable ) ( not .Values.externalSecretsOperator.enable ) }} 
        {{- range .Values.secretProviderClass.secretObjects }}
        - name: {{ .envName }}
          valueFrom:
            secretKeyRef:
              name: {{ .secretName }}
              key: {{ (index .data 0).key }}
        {{ end -}}
        {{ else if and (.Values.externalSecretsOperator.enable) ( not .Values.secretProviderClass.enable ) }}
        {{- $root := . }}
        {{ range .Values.externalSecretsOperator.externalSecret.data }}
        - name: {{ .envName }}
          valueFrom:
            secretKeyRef:
              name: {{ $root.Values.externalSecretsOperator.externalSecret.target.name }}
              key: {{ .remoteRef.key }}
        {{ end -}}
        {{ else }}        
        - name: AUTH_TOKEN
          value: {{ .Values.env.authtoken }}
        - name: HARBOR_ID
          value: {{ .Values.env.harbour_id }}
        - name: SHIP_ID
          value: {{ .Values.env.ship_id }}
        {{ end }}
        - name: CONTAINER_MANAGER_TYPE
          value: KUBERNETES
        {{ if .Values.imageOverride.enable }}
        - name: IMAGE_OVERRIDES
          value: {{ .Values.imageOverride.images | toJson | quote }}
        - name: DOCKER_REGISTRY
          value: {{ .Values.imageOverride.docker_registry | quote }}
        - name: AUTO_KUBERNETES_UPDATE
          value: {{ .Values.imageOverride.auto_update | quote }}
        - name: AUTO_UPDATE_CONTAINERS_WHILE_RUNNING
          value: {{ .Values.imageOverride.auto_update_running_containers | quote }}
        {{ else }}    
        - name: IMAGE_OVERRIDES
          value: '{}'
        - name: DOCKER_REGISTRY
          value: {{ .Values.image.docker_registry | quote }}
        - name: AUTO_KUBERNETES_UPDATE
          value: {{ .Values.image.auto_update | quote }}
        - name: AUTO_UPDATE_CONTAINERS_WHILE_RUNNING
          value: {{ .Values.image.auto_update_running_containers | quote }}
        {{ end -}}          
        {{ if .Values.proxy.enable -}}
          {{ if .Values.proxy.http_proxy }}
        - name: HTTP_PROXY
          value: {{ .Values.proxy.http_path }}
          {{- end -}}
          {{ if .Values.proxy.https_proxy }}
        - name: HTTPS_PROXY
          value: {{ .Values.proxy.https_path }}
          {{- end }}
        - name: NO_PROXY
          value: {{ .Values.proxy.no_proxy }}
        {{ end -}}
        {{ if .Values.ca_bundle.enable }} 
        - name: REQUESTS_CA_BUNDLE
          value: {{ .Values.ca_bundle.volume.mount_path }}/{{ .Values.ca_bundle.request_ca_bundle }}
        - name: AWS_CA_BUNDLE
          value: {{ .Values.ca_bundle.volume.mount_path }}/{{ .Values.ca_bundle.aws_ca_bundle }}
          {{- if not .Values.gridProxy.enable }}
        - name: KUBERNETES_CA_BUNDLE_MOUNT
          value: REQUESTS_CA_BUNDLE={{ .Release.Name }}-configmap={{ .Values.ca_bundle.request_ca_bundle }}:AWS_CA_BUNDLE={{ .Release.Name }}-configmap={{ .Values.ca_bundle.aws_ca_bundle }}
          {{ end -}}
        {{ end -}}
        {{ if .Values.gridProxy.enable }} 
        - name: A_ENVIRONMENT
          value: {{ .Values.gridProxy.a_environment }}
        - name: TLS_KEY_GRID
          value: {{ .Values.gridProxy.volume.mount_path }}/{{ .Values.gridProxy.tlsKeyGrid }}
        - name: TLS_CERT_GRID
          value: {{ .Values.gridProxy.volume.mount_path }}/{{ .Values.gridProxy.tlsCertGrid }}
          {{ if not .Values.ca_bundle.enable }}
        - name: KUBERNETES_CA_BUNDLE_MOUNT
          value: TLS_KEY_GRID={{ .Release.Name }}-configmap={{ .Values.gridProxy.tlsKeyGrid }}:TLS_CERT_GRID={{ .Release.Name }}-configmap={{ .Values.gridProxy.tlsCertGrid }}
          {{ end -}}
        {{ end -}}
        {{ if and .Values.ca_bundle.enable .Values.gridProxy.enable }}
        - name: KUBERNETES_CA_BUNDLE_MOUNT
          value: REQUESTS_CA_BUNDLE={{ .Release.Name }}-configmap={{ .Values.ca_bundle.request_ca_bundle }}:AWS_CA_BUNDLE={{ .Release.Name }}-configmap={{ .Values.ca_bundle.aws_ca_bundle }}:TLS_KEY_GRID={{ .Release.Name }}-configmap={{ .Values.gridProxy.tlsKeyGrid }}:TLS_CERT_GRID={{ .Release.Name }}-configmap={{ .Values.gridProxy.tlsCertGrid }}
        {{ end -}}
        {{ if and (.Values.istio_ingress.enable)  (not .Values.nginx_ingress.enable ) }}
        - name: KUBERNETES_WEB_EXPOSE_TYPE
          value: ISTIO
        - name: KUBERNETES_WEB_EXPOSE_SUB_DOMAIN
          value: {{ .Values.istio_ingress.web_expose_subdomain | quote }}
        - name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
          value: {{ .Values.istio_ingress.credentialName | quote }}
        - name: KUBERNETES_SERVICE_USE_TYPE
          value: CLUSTERIP
        - name: KUBERNETES_SERVICES_BLOCKING_GET
          value: "true"
        - name: KUBERNETES_ISTIO_GATEWAY_NAME
          value: {{ .Values.istio_ingress.istio_gateway_name | quote }}
        {{ end -}}
        {{ if and (.Values.nginx_ingress.enable)  (eq .Values.istio_ingress.enable false)}}
        - name: KUBERNETES_WEB_EXPOSE_TYPE
          value: INGRESS
        - name: KUBERNETES_INGRESS_CLASS
          value: "nginx"
        - name: KUBERNETES_SERVICE_USE_TYPE
          value: CLUSTERIP
        - name: KUBERNETES_WEB_EXPOSE_SUB_DOMAIN
          value: {{ .Values.nginx_ingress.web_expose_subdomain | quote }}
        - name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
          value: {{ .Values.nginx_ingress.credentialName | quote }}
        - name: PARALLEL_HANDLERS_COUNT
          value: '50'
        - name: USE_PARALLEL_HANDLER
          value: 'true'
        - name: RUN_HEALTH_WEB_SERVICE
          value: 'true'
        {{end -}}
        {{ if .Values.non_privilege_container.enable }}
        - name: INHERIT_RUNNING_USER_AND_GROUP
          value: 'true'
        {{ end -}}
        {{ if .Values.labelsExecutors.enable }}
        - name: KUBERNETES_LABELS
          value: {{ .Values.labelsExecutors.syntax | toJson | quote }}
        {{ end -}}
        {{ if .Values.tolerationExecutors.enable }}
        - name: KUBERNETES_TOLERATIONS_JSON
          value: {{ .Values.tolerationExecutors.syntax | toJson | quote }}
        {{ end -}}
        {{ if .Values.nodeSelectorExecutor.enable }}
        - name: KUBERNETES_NODE_SELECTOR_JSON
          value: {{ .Values.nodeSelectorExecutor.syntax | toJson | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.requests.CPU }}
        - name: KUBERNETES_RESOURCES_DEFAULT_CPU
          value: {{ .Values.resourcesExecutors.requests.CPU | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.requests.MEM }}
        - name: KUBERNETES_RESOURCES_DEFAULT_MEM
          value: {{ .Values.resourcesExecutors.requests.MEM | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.limits.CPU }}
        - name: KUBERNETES_RESOURCES_LIMITS_CPU
          value: {{ .Values.resourcesExecutors.limits.CPU | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.limits.MEM }}
        - name: KUBERNETES_RESOURCES_LIMITS_MEMORY
          value: {{ .Values.resourcesExecutors.limits.MEM | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.limits.storage }}
        - name: KUBERNETES_LIMITS_EPHEMERAL_STORAGE
          value: {{ .Values.resourcesExecutors.limits.storage | quote }}
        {{ end -}}
        {{ if .Values.resourcesExecutors.requests.storage }}
        - name: KUBERNETES_REQUESTS_EPHEMERAL_STORAGE
          value: {{ .Values.resourcesExecutors.requests.storage| quote }}
        {{ end -}}
        {{ if .Values.gridProxy.enable }}
        - name: DODUO_PORT
          value: {{ .Values.gridProxy.doduoPort | quote }}
        - name: TLS_CERT_GRID
          value: {{ .Values.gridProxy.tlsCertGrid | quote }}
        - name: TLS_KEY_GRID
          value: {{ .Values.gridProxy.tlsKeyGrid | quote }}
        {{ end -}}
        {{ if .Values.imageOverride.enable }} 
        image: {{ .Values.imageOverride.image }}:{{ .Values.imageOverride.tag }}
        imagePullPolicy: {{ .Values.imageOverride.pullPolicy }}
        {{ else }}
        image: {{ .Values.image.image }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{ end -}}
        name: crane-container
        {{ with .Values.resourcesCrane -}}
        {{ if or (.requests.CPU) (.limits.CPU) (.limits.MEM) (.requests.MEM) (.requests.storage) (.limits.storage) }}
        resources:
          {{ if or (.requests.MEM) (.requests.CPU) (.requests.storage) }}  
          requests:
            cpu: {{ .requests.CPU | default "250m" }}
            memory: {{ .requests.MEM | default "512Mi" }}
            {{ if .requests.storage }}
            storage: {{ .requests.storage }}
            {{ end -}}
          {{ end -}}
          {{ if or (.limits.MEM) (.limits.CPU) (.limits.storage) }} 
          limits:
            cpu: {{ .limits.CPU | default "1" }}  
            memory: {{ .limits.MEM | default "2Gi" }}
            {{ if .limits.storage }}
            storage: {{ .limits.storage }}
            {{ end -}}       
          {{ end -}}
        {{ end -}}
        {{ end -}}
        {{ if .Values.non_privilege_container.enable }}  
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: {{ .Values.non_privilege_container.runAsGroup }} 
          runAsUser: {{ .Values.non_privilege_container.runAsUser }}        
      {{ end -}}
      {{ with .Values.probes -}}
        {{ if .enable }}
        livenessProbe:
          httpGet:
            path: /healtz
            port: {{ .livenessProbe.port | default 5000 }}
            scheme: HTTP
          failureThreshold: {{ .livenessProbe.failureThreshold | default 5 }}
          initialDelaySeconds: {{ .livenessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .livenessProbe.periodSeconds | default 15 }}
          successThreshold: {{ .livenessProbe.successThreshold | default 1 }}
          timeoutSeconds: {{ .livenessProbe.timeoutSeconds | default 10 }}   
                
        readinessProbe:
          httpGet:
            path: /healtz
            port: {{ .readinessProbe.port | default 5000 }}
            scheme: HTTP
          failureThreshold: {{ .readinessProbe.failureThreshold | default 3 }}
          initialDelaySeconds: {{ .readinessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .readinessProbe.periodSeconds | default 15 }}
          successThreshold: {{ .readinessProbe.successThreshold | default 1 }}
          timeoutSeconds: {{ .readinessProbe.timeoutSeconds | default 10 }}
        {{ end -}}
      {{ end -}}      
      {{ if or ( .Values.ca_bundle.enable ) ( .Values.gridProxy.enable ) (.Values.secretProviderClass.enable) (.Values.externalSecretsOperator.enable)}} 
        volumeMounts:
          {{ if .Values.ca_bundle.enable }}
        - name: {{ .Values.ca_bundle.volume.volume_name }}
          mountPath: {{ .Values.ca_bundle.volume.mount_path }}
          readOnly: {{ .Values.ca_bundle.volume.readOnly }}
          {{ end -}}
          {{ if .Values.gridProxy.enable }}
        - name: {{ .Values.gridProxy.volume.volume_name }}
          mountPath: {{ .Values.gridProxy.volume.mount_path }}
          readOnly: {{ .Values.gridProxy.volume.readOnly }}
          {{ end -}}
          {{ if .Values.secretProviderClass.enable }}
        - name: {{ .Values.secretProviderClass.volume.name | default (printf "%s-secrets-store-volume" .Release.Name) }} #npd-blaze-secret-store
          mountPath: {{ .Values.secretProviderClass.volume.path | default "/mnt/secrets" }}
          readOnly: {{ .Values.secretProviderClass.volume.readOnly | default true }}
          {{ end -}}
          {{ if .Values.externalSecretsOperator.enable }}
        - name: {{ .Values.externalSecretsOperator.volume.name | default (printf "%s-externalsecrets-volume" .Release.Name) }}
          mountPath: {{ .Values.externalSecretsOperator.volume.path | default "/mnt/secrets" }}
          readOnly: {{ .Values.externalSecretsOperator.volume.readOnly | default true }}
          {{ end }}
      volumes:
          {{ if .Values.ca_bundle.enable }}
      - name: {{ .Values.ca_bundle.volume.volume_name }}
        configMap:
          name: {{ .Release.Name }}-configmap
          {{ end -}}
          {{ if .Values.gridProxy.enable }}
      - name: {{ .Values.gridProxy.volume.volume_name }}
        configMap:
          name: {{ .Release.Name }}-configmap
          {{ end -}}
          {{ if .Values.secretProviderClass.enable }}
      - name: {{ .Values.secretProviderClass.volume.name | default (printf "%s-secrets-store-volume" .Release.Name) }} 
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: {{ .Values.secretProviderClass.volume.readOnly | default true }}
          volumeAttributes:
            secretProviderClass: {{ .Release.Name }}-secrets-store #non-prod-blaze-deployment-aws-secrets
          {{ end -}}        
          {{ if .Values.externalSecretsOperator.enable }}
      - name: {{ .Values.externalSecretsOperator.volume.name | default (printf "%s-externalsecrets-volume" .Release.Name) }}
        secret:
          secretName: {{ .Values.externalSecretsOperator.externalSecret.target.name }}
          {{ end -}}            
      {{ end }}    
      restartPolicy: {{ .Values.deployment.restartPolicy }}
      terminationGracePeriodSeconds: 30