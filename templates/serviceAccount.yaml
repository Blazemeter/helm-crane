{{- if .Values.deployment.serviceAccount.create | default false }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blazemeter-crane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.deployment.serviceAccount.annotations }}
  annotations:
    {{- with .Values.deployment.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    role: {{ include "crane.roleName" . }}
    clusterrole: {{ include "crane.clusterroleName" . }}
    {{ if .Values.labelsCrane.enable | default false -}}
    {{ .Values.labelsCrane.syntax | toYaml | nindent 4 -}}
    {{- end }}
{{- else if .Values.deployment.serviceAccount.annotations }}
---
# Patch existing ServiceAccount with annotations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blazemeter-crane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- with .Values.deployment.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{ if .Values.labelsCrane.enable | default false -}}
    {{ .Values.labelsCrane.syntax | toYaml | nindent 4 -}}
    {{- end }}
{{- end }}
