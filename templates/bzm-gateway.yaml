{{ if  eq .Values.service_virtualization.ingressType "istio" }}
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  namespace : {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http-80
      protocol: HTTP
    hosts:
    - "*"
  - port:
      number: 443
      name: https-443
      protocol: HTTPS
    hosts:
    - "*"      
    tls:
      mode: SIMPLE
      # This must be located in the "istio-system" namespace
      credentialName: {{ .Values.service_virtualization.credentialName }}
  - port:
      number: 15443
      name: https-15443
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: PASSTHROUGH
{{ end }}
